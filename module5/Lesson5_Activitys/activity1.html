<!DOCTYPE html>
<html lang="en">
<head>

    <title>Delivery order  </title>
</head>
<body>
<style>

body{
    background-color:blue;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
}

h1{
    color:darkred
}
button{
    background:limegreen;
    color: white;
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin: 5px; 
}
div{
    border: 2px solid black;
    width: 280px;
    margin: 6px auto;
    text-align: left;
    border-radius: 6px;
    padding: 8px 12px;
}
</style>
<h1> my delivery tracker</h1>
<button onclick="saveOrder()">Save order</button>
<button onclick="startDelivery()">Start delivery</button>

<div>JSON Text: <span id="json-text"></span></div>
<div>Loaded Item: <span id="loaded-item"></span></div>
<div>Loaded Price: <span id="loaded-price"></span></div>
<div>Status: <span id="status"></span></div>
<div>Result: <span id="result"></span></div>

<script>
let order = {
    item: "Pizza",
    price: 5,
    shop: "my snack shop",
};

function saveOrder(){
let jsonText = JSON.stringify(order);
let loadedorder = JSON.parse(jsonText);

document.getElementById("json-text").innerHTML=jsonText;
document.getElementById("loaded-item").innerHTML=loadedorder.item;
document.getElementById("loaded-price").innerHTML= "$" + loadedorder.price;
}

function delay(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}

async function startDelivery() {
document.getElementById("result").innerHTML = "";
document.getElementById("status").innerHTML = "order received";
setTimeout(function() {
    document.getElementById("status").innerHTML = "kitchen is being prepared";
}, 1000);

await delay(3000);
document.getElementById("status").innerHTML = "out for delivery";

await delay(2000);
document.getElementById("result").innerHTML = "your order has been delivered";
}








</script>


















</body>
</html>
