<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Map Array</title>
</head>
<body>
    <p>multiply every element by 10</p>
<p id="product_value">  </p>
<script>
var numbers = [3, 5, 100, 1, 56];


function myfunction(num) {
    return num * 10;
}


var new_array = numbers.map(myfunction);

document.getElementById("product_value").innerHTML = new_array;








</script>


</body>
</html>
