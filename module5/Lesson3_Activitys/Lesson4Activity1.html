<!DOCTYPE html>
<html lang="en">
<head>

    <title>making number to strings</title>
</head>
<body>
    <h2>JavaScript Strings</h2>
    <h2>this can convert a number to a string</h2>
<p id="number_result"></p>
<p id="string_result"></p>
<script>
var x = 123;
var y = 40

document.getElementById("number_result").innerHTML = x + y;
document.getElementById("string_result").innerHTML = String(x) + String(y);




</script>


</body>
</html>
