<!DOCTYPE html>
<html lang="en">
<head>
    
    <title> Error handling in JS</title>
</head>
<body>
</body>
<h1> Error handling in JS  </h1>
<p> This will demonstrate error handling in JavaScript using <b>catch</b> .</p>
<p id="error_result"></p>


<script>
try{
 alert("This is an error");

}
catch(err)
{
    document.getElementById("error_result").innerHTML = err.message;
}



</script>







</body>
</html>
