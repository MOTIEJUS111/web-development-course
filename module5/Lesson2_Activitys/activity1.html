<!DOCTYPE html>
<html lang="en">
<head>
    
    <title> Planet cards</title>
<style>
.body{
background-color: blue;
font-family: Arial, Helvetica, sans-serif;
padding: 15px,10px;
text-align: center;
}
h1{
color: black;
}
.cards {
display: flex;
justify-content: center;;
gap: 20px;
margin-top: 25px;

}
.card{
background: white;
border: 3px orange;
border-radius: 12px;
padding: 20px;
width: 200px;
}
.planet-name{
font-size: 20px;
font-weight: bold;
color: blue;

}
.planet-fact { color: blue; margin-top: 10px; font-size: 14px;}
button{

background:orange ;
color: white;
padding: 12px,28px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 16px;
margin: 10px;
}





</style>
</head>
<body>
<h1> Planet Cards</h1>
<h2>  I will show 2 Diffrent Planets  </h2>
<button onclick="showplanets()" >  Show Planets  </button>
<div class="cards"> 
<div id="card1"></div>
<div id="card2"></div>
<div id="card3"></div>
</div>
<script>
class planet {
   constructor (name,fact){
   this.name = name;
   this.fact = fact;
   }
   describe (){
    return this.name + ": " + this.fact  
}
}


function showplanets(){
let p1 = new planet("Earth","this Planet has life.");
let p2 = new planet("mars","This planet is red.");

document.getElementById("card1").innerHTML =
"<div class='card'><div class='planet-name'>" + p1.name + "</div>" +
"<div class='planet-fact'>" + p1.describe() + "</div></div>";

document.getElementById("card2").innerHTML =
"<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
"<div class='planet-fact'>" + p2.describe() + "</div></div>";



}






















</script>




</body>
</html>
