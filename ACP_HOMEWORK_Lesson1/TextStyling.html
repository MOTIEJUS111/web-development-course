<!DOCTYPE html><html>
<head>
    <title>Text styling</title>
</head>
<style>
h3{
width: 100px;
height: 100px;
background-color: aqua;
border: 5px solid brown;


}
p{
width: 200px;
height: 200px;
transform:rotate(45deg);

}
b{
text-decoration: underline;


}
strong{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: red;
}
h4{
text-shadow: 2px 2px 1px red;
}

</style>
<body>
<h3>Hello i am a 13 year old boy and i do lots of coding</h3>
<p>i do boxing</p>
<b>Hello i am born on augast</b><br>
<strong>I have a computer</strong>
<h4>I dont like tennis</h4>



</body>











</html>
