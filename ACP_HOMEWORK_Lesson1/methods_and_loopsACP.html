<!DOCTYPE html>
<html lang="en">
<head>
    <title>Methods and loops ACP</title>
</head>
<body>
   <h1> Methods and loops ACP</h1>
    <p id="demo"></p>
<script>
var numbers=["1","2","3","4"];
var text="";
var i;
numbers.pop();  
document.getElementById("demo").innerHTML=numbers;

for(i=0;i<numbers.length;i++)
{
text  +=numbers[i]+"<br>";


}
document.getElementById("demo").innerHTML=text;
</script>




</body>
</html>
