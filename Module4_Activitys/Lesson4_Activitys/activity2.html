<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>built in Maths objects in JS</title>
</head>
<body>
    <h1>JS math object methods</h1>

<script >
var value=Math.abs(20);
document.write("demo value is " +  value  + "<br>" );


var value=Math.acos(-1);
document.write("demo 1  value is " +  value  + "<br>" );


var value=Math.asin(1);
document.write("demo 2 value is " +  value  + "<br>" );


var value=Math.atan(.5);
document.write("demo 3 value is " +  value  + "<br>" );









</script>







</body>
</html>
