<!DOCTYPE html>
<html lang="en">
<head>
 
    <title> loops in JS</title>
</head>
<body>
<h1> JS loop</h1>
<p id="demo"></p>

    <script>
var fruits=["apple","orange","banana","bluberry","kiwi"];
var text="";
var i;
for(i=0;i<fruits.length;i++)
{
text  +=fruits[i]+"<br>";


}
document.getElementById("demo").innerHTML=text;
    </script>
</body>
</html>
