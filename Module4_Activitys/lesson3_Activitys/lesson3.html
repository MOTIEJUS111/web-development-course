<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>switch</title>
</head>
<body>
    <script>
var x=8;
switch(x)
{
case  1:
    document.write("monday");
break;
case  2:
    document.write("tuesday");
break;
case  3:
    document.write("wednesday");
break;
case  4:
    document.write("thursday");
break;
case  5:
    document.write("friday");
break;
case  6:
    document.write("saturday");
break;
case  7:
    document.write("sunday");
break;

default:document.write("its not a valid day");
}







    </script>
</body>
</html>
