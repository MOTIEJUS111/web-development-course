<!DOCTYPE html>

    <title>call stack</title>

<body>
<h1> call stack    </h1>
<P id="demo">  </P>

<script>


function add(a,b)
{
return a+b;


}



function average(a,b)
{
return add(a,b)/2;


}





var result=average(2,5);
document.getElementById("demo").innerHTML=result;

</script>
