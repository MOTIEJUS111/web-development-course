<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>methods in array</title>
</head>
<body>
    <h2>  Array methods  </h2>
     <h3>Join and Pop</h3>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
<script>
var Gaming=["pc","Xbox","playstation","nintendo"];

document.getElementById("demo").innerHTML=Gaming.join("-");
document.getElementById("demo1").innerHTML=Gaming;  
Gaming.pop();
document.getElementById("demo2").innerHTML=Gaming;








</script>
</body>
</html>
