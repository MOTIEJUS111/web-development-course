<!DOCTYPE html><html>
<head>
    <title>Dropdowns</title>
</head>
<body>
    <fieldset>
<h1> Forms for subjects </h1>
<form action="/action_page.php"
oninput = "x.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">
<label>Name</label><br>
<input type="text" id="Name"><br><br>
<label>Marks</label><br>

<select name="Subject1"   id="subject1">
<option  value="maths">maths</option>       
<option  value="science">science</option>       
<option  value="english">english</option>         
</select>

<input  type="number" id="m1" name="m1"><br><br>
<select name="Subject2"   id="subject2">
<option  value="maths">maths</option>       
<option  value="science">science</option>       
<option  value="english">english</option>  
</select>
        
<input  type="number" id="m2" name="m2"><br><br>
<select name="Subject3"   id="subject3">
<option  value="maths">maths</option>       
<option  value="science">science</option>       
<option  value="english">english</option>  
</select>

<input   type="number" id="m3" name="m3">
calculating marks average;<output  name="x"    for="m1 m2 m3 "    ></output>
 
</form>
</fieldset>
</body>
</html>
